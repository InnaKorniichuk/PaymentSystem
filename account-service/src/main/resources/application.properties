spring.application.name=account-service
spring.datasource.url=jdbc:postgresql://localhost:5432/account_db
spring.datasource.username=account_app
spring.datasource.password=${ACCOUNT_DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=account-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties[spring.json.value.default.type]=com.example.user.event.UserCreatedEvent
spring.kafka.consumer.properties[spring.json.trusted.packages]=com.example.user.event