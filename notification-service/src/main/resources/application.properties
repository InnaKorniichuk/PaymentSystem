server.port=8089
spring.application.name=notification-service
spring.datasource.url=jdbc:postgresql://localhost:5432/notification_db
spring.datasource.username=notification_app
spring.datasource.password=${NOTIFICATION_DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
jwt.secret=${JWT_SECRET}

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties[spring.json.trusted.packages]=com.example.shared.event

logging.level.org.springframework.security=DEBUG
logging.level.com.example.notificationservice=INFO