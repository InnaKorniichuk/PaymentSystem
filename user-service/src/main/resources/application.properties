server.port=${PORT:8080}
spring.application.name=user-service
spring.jpa.properties.hibernate.default_schema=users
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
jwt.secret=${JWT_SECRET}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
logging.level.org.springframework.security=WARN

spring.kafka.properties.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=SCRAM-SHA-256
spring.kafka.properties.sasl.jaas.config=${KAFKA_JAAS_CONFIG}
spring.kafka.ssl.trust-store-type=PEM
spring.kafka.ssl.trust-store-location=file:/etc/secrets/ca.pem